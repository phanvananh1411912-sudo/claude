<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hán Tự Emoji · Phân tích chữ Hán bằng emoji</title>
<style>
:root{
  --sand:#f3ecdd; --sand-deep:#e4d7bd; --clay:#b46a43; --ink:#2f2a22; --ink-soft:#8a8073;
  --card:#fffdf7; --border:#e9dfca; --primary:#cf5a2c; --primary-foreground:#fff;
  --semantic:#2f9e6f; --semantic-soft:#e2f3ea;   /* xanh lá = TRẠNG THÁI thành công */
  --nghia:#2f7fd6; --nghia-soft:#e4eefb;         /* xanh dương = NGHĨA (semantic) */
  --am:#d6455d; --am-soft:#fbe6ea;               /* đỏ = ÂM (phonetic) */
  --danger:#d6455d; --berry:#c94f7c; --sun:#f2b705;
  --grad-hero:linear-gradient(120deg,#f7913d 0%,#e0567a 52%,#9a6cf0 100%);
  --shadow-pop:0 8px 20px -6px rgba(207,90,44,.45);
  --shadow-lift:0 22px 48px -16px rgba(60,40,20,.32);
  --bg:#f7f1e5;
}
@media (prefers-color-scheme: dark){
  :root{
    --sand:#2b2620; --sand-deep:#3d3529; --clay:#d68a5c; --ink:#efe8db; --ink-soft:#a89e8c;
    --card:#241f19; --border:#3a332a; --primary:#e06a3c; --primary-foreground:#fff;
    --semantic:#4bbe8a; --semantic-soft:#1e3a2e;
    --nghia:#5b9dd8; --nghia-soft:#1d2c3d; --am:#e0687c; --am-soft:#3a1e26;
    --danger:#e0687c; --berry:#dd6f9a; --sun:#f2c33f; --bg:#191510;
    --shadow-lift:0 22px 48px -16px rgba(0,0,0,.55);
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1100px 520px at 12% -8%, color-mix(in srgb,var(--berry) 10%, transparent), transparent),
    radial-gradient(1000px 480px at 100% 0%, color-mix(in srgb,var(--nghia) 10%, transparent), transparent),
    var(--bg);
  color:var(--ink); min-height:100vh;
  font-family:"DM Sans","Segoe UI",Roboto,-apple-system,system-ui,sans-serif; line-height:1.5;
}
.font-cjk{font-family:"Noto Sans SC","Noto Sans CJK SC","PingFang SC","Microsoft YaHei","Songti SC",serif}
h1,h2,h3{font-family:"Space Grotesk","DM Sans",system-ui,sans-serif}
em{font-style:italic}

.shell{position:relative;overflow:hidden;min-height:100vh}
.container{position:relative;max-width:1100px;margin:0 auto;padding:40px 24px 60px}
@media(max-width:640px){.container{padding:24px 16px 48px}}
.float-layer{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.float-glyph{position:absolute;font-weight:700;user-select:none;animation:float 9s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-26px)}}

header.app{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:20px;margin-bottom:32px}
.brand{display:flex;align-items:center;gap:16px}
.logo{position:relative;width:64px;height:64px;border-radius:18px;display:grid;place-items:center;
  font-size:34px;background:var(--grad-hero);background-size:200% 200%;box-shadow:var(--shadow-pop);animation:gradient 6s ease infinite}
.logo .spark{position:absolute;top:-4px;right:-4px;width:16px;height:16px;border-radius:50%;background:var(--sun);animation:glow 2s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--sun) 70%,transparent)}50%{box-shadow:0 0 0 8px transparent}}
.brand h1{margin:0;font-size:32px;letter-spacing:-.5px;font-weight:700}
.grad-text{background:var(--grad-hero);background-size:200% 200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:gradient 6s ease infinite}
.brand p{margin:6px 0 0;font-size:14px;color:var(--ink-soft)}
.brand p b{color:var(--clay);font-weight:600}
.status-tag{display:flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;background:var(--card);border:1px solid var(--border)}
.status-tag .dot{width:8px;height:8px;border-radius:50%;background:var(--semantic);animation:pulse 1.8s ease-in-out infinite}
.status-tag span.txt{font-size:12px;font-weight:600;color:var(--ink-soft)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@media(max-width:560px){.status-tag{display:none}.brand h1{font-size:26px}}

nav.modes{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:26px}
.mode-btn{position:relative;border:2px solid var(--border);background:var(--card);color:var(--ink-soft);
  padding:12px 18px;border-radius:16px;font-size:14px;font-weight:700;cursor:pointer;transition:.16s;overflow:hidden}
.mode-btn:hover{color:var(--ink);transform:translateY(-2px);border-color:color-mix(in srgb,var(--clay) 40%,transparent)}
.mode-btn.active{color:#fff;border-color:transparent;box-shadow:var(--shadow-pop);transform:scale(1.05)}
.mode-btn .bar{position:absolute;inset:0;background-size:200% 200%;animation:gradient 6s ease infinite;opacity:0}
.mode-btn.active .bar{opacity:1}
.mode-btn .lbl{position:relative;display:flex;align-items:center;gap:8px}
.mode-btn .hint{font-size:11px;font-weight:500;opacity:.7}
@media(max-width:680px){.mode-btn .hint{display:none}}

main.panel{position:relative;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(6px);
  border:2px solid color-mix(in srgb,var(--border) 70%,transparent);border-radius:32px;
  box-shadow:var(--shadow-lift);padding:40px;overflow:hidden;animation:popIn .4s cubic-bezier(.2,.8,.2,1)}
@media(max-width:640px){main.panel{padding:22px}}
.panel-bar{position:absolute;left:0;right:0;top:0;height:6px;background-size:200% 200%;animation:gradient 6s ease infinite}
@keyframes popIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
@keyframes gradient{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

footer.app{margin-top:34px;text-align:center;font-size:12px;color:var(--ink-soft)}
footer.app code{background:var(--card);border:1px solid var(--border);padding:2px 8px;border-radius:7px;color:var(--clay);font-weight:600;margin:0 2px}

.split{display:grid;grid-template-columns:1fr 1.1fr;gap:32px;align-items:start}
@media(max-width:900px){.split{grid-template-columns:1fr;gap:26px}}

.btn-primary{display:inline-flex;align-items:center;gap:8px;background:var(--grad-hero);background-size:200% 200%;
  color:#fff;font-weight:700;padding:12px 24px;border:none;border-radius:16px;cursor:pointer;
  box-shadow:var(--shadow-pop);animation:gradient 6s ease infinite;transition:transform .15s,box-shadow .2s}
.btn-primary:hover{transform:translateY(-2px) scale(1.02);box-shadow:var(--shadow-lift)}
.btn-ghost{display:inline-flex;align-items:center;background:var(--card);color:var(--ink);border:2px solid var(--border);
  font-weight:700;padding:10px 22px;border-radius:16px;cursor:pointer;transition:.15s}
.btn-ghost:hover{background:var(--sand);border-color:var(--clay);transform:translateY(-1px)}

.pill{padding:8px 16px;border-radius:999px;font-size:14px;font-weight:500;border:1px solid var(--border);
  background:var(--sand);color:var(--ink);cursor:pointer;transition:.14s}
.pill:hover{border-color:var(--sand-deep)}
.pill.active{background:var(--primary);color:var(--primary-foreground);border-color:var(--primary)}
.pill .cjk{font-family:"Noto Sans SC",serif;margin-right:4px;font-size:16px}

.step{display:flex;align-items:center;gap:8px;margin:26px 0 12px}
.step:first-child{margin-top:0}
.step .num{width:24px;height:24px;border-radius:50%;background:var(--primary);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}
.step h3{margin:0;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.18em;color:var(--clay)}

/* type badge */
.type-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;background:var(--card);border:1px solid var(--border);font-size:13px;font-weight:700;color:var(--clay)}

/* ===== CÔNG THỨC (formula) ===== */
.formula{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px;padding:18px 14px;border-radius:18px;background:var(--sand);border:1px solid var(--border);margin:14px 0}
.fchip{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:70px;padding:10px 12px;border-radius:14px;background:var(--card);position:relative;overflow:hidden}
.fchip.nghia{border:2px solid var(--nghia)}
.fchip.am{border:2px solid var(--am)}
.fchip.picto{border:2px dashed var(--border);min-width:96px}
.fchip .fe{font-size:34px;line-height:1}
.fchip.picto .fe{font-size:56px}
.fchip .fc{font-family:"Noto Sans SC",serif;font-size:32px;font-weight:600;color:var(--am);line-height:1}
.fchip .fpy{font-size:12px;color:var(--am);font-weight:700}
.fchip .fvi{font-size:10px;color:var(--ink-soft);max-width:76px;text-align:center}
.fchip small{font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.fchip.nghia small{color:var(--nghia)}
.fchip.am small{color:var(--am)}
.fchip .ffade{position:absolute;right:-6px;bottom:-8px;font-size:30px;opacity:.16;pointer-events:none}
.feq{font-size:24px;color:var(--ink-soft);font-weight:800}
.fbig{font-family:"Noto Sans SC",serif;font-size:56px;font-weight:700;line-height:1}
.fbig-wrap{display:flex;flex-direction:column;align-items:center;gap:2px}
.fbig-wrap .fpy{font-size:13px;color:var(--ink-soft);font-weight:600}

/* tianzige */
.tianzige{position:relative;margin:0 auto;border-radius:20px;border:1px solid var(--border);background:var(--card);box-shadow:inset 0 2px 12px rgba(60,45,30,.08)}
.tianzige.lg{aspect-ratio:1;width:100%;max-width:380px}
.tz-hline{position:absolute;left:16px;right:16px;top:50%;height:1px;background:repeating-linear-gradient(to right,var(--sand-deep) 0 6px,transparent 6px 14px)}
.tz-vline{position:absolute;top:16px;bottom:16px;left:50%;width:1px;background:repeating-linear-gradient(to bottom,var(--sand-deep) 0 6px,transparent 6px 14px)}
.tz-cell{position:absolute;display:flex;align-items:center;justify-content:center;padding:12px;transition:all .3s}
.tz-cell.left{left:0;top:0;bottom:0;width:50%}.tz-cell.right{right:0;top:0;bottom:0;width:50%}
.tz-cell.top{left:0;right:0;top:0;height:50%}.tz-cell.bottom{left:0;right:0;bottom:0;height:50%}
.tz-glyph{font-family:"Noto Sans SC",serif;font-weight:600;line-height:1}
.tianzige.lg .tz-glyph{font-size:clamp(3.2rem,14vw,5.8rem)}
.tz-cell.dim{opacity:.2}
.tz-full .tz-glyph{font-size:8rem;color:color-mix(in srgb,var(--sand-deep) 60%,transparent)}
.tz-badge{position:absolute;right:-12px;bottom:-12px;width:56px;height:56px;border-radius:50%;background:var(--semantic);color:#fff;display:grid;place-items:center;font-size:26px;font-weight:700;box-shadow:var(--shadow-lift);animation:popIn .3s}
/* pictograph big panel */
.picto-panel{aspect-ratio:1;width:100%;max-width:380px;margin:0 auto;border-radius:20px;border:1px solid var(--border);background:var(--card);display:grid;place-items:center;box-shadow:inset 0 2px 12px rgba(60,45,30,.08);position:relative}
.picto-panel .pe{font-size:9rem;line-height:1}
.picto-panel .pg{position:absolute;right:16px;bottom:12px;font-family:"Noto Sans SC",serif;font-size:2.4rem;color:color-mix(in srgb,var(--sand-deep) 70%,transparent);font-weight:600}

/* chips (learn/quiz/create) */
.chip-grid{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.radical-chip{width:96px;padding:12px;border-radius:14px;border:2px solid var(--border);background:var(--sand);cursor:pointer;transition:.15s;text-align:center;display:flex;flex-direction:column;align-items:center}
.radical-chip:hover{transform:translateY(-2px);box-shadow:var(--shadow-pop)}
.radical-chip.is-selected{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 12%,var(--card));transform:translateY(-3px)}
.radical-chip.is-wrong{border-color:var(--danger);background:var(--am-soft);animation:shake .4s}
.radical-chip.is-correct{border-color:var(--semantic);background:var(--semantic-soft)}
.radical-chip .emoji{font-size:26px;line-height:1}
.radical-chip .glyph{font-family:"Noto Sans SC",serif;font-size:22px;font-weight:600;margin-top:8px}
.radical-chip .cap{font-size:11px;color:var(--ink-soft);margin-top:4px;min-height:26px}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}

/* part card — new principle */
.part-card{padding:14px;border-radius:14px;background:var(--card);border:1px solid var(--border);border-left:4px solid var(--border);box-shadow:0 2px 8px rgba(60,45,30,.05);transition:.2s}
.part-card:hover{box-shadow:0 6px 16px rgba(60,45,30,.1)}
.part-card.nghia{border-left-color:var(--nghia)}
.part-card.am{border-left-color:var(--am)}
.part-card .row{display:flex;align-items:center;gap:14px}
.role-visual{width:62px;height:62px;border-radius:14px;display:grid;place-items:center;flex-shrink:0;position:relative;overflow:hidden}
.role-visual.nghia{background:var(--nghia-soft);border:2px solid var(--nghia)}
.role-visual.am{background:var(--am-soft);border:2px solid var(--am)}
.role-visual .rv-emoji{font-size:32px;line-height:1}
.role-visual .rv-char{font-family:"Noto Sans SC",serif;font-size:34px;font-weight:600;color:var(--am);line-height:1}
.role-visual .rv-fade{position:absolute;right:-4px;bottom:-6px;font-size:26px;opacity:.18}
.part-card .meta{flex:1;min-width:0}
.part-card .meta .head{font-size:15px}
.part-card .meta .head b{font-weight:700}
.part-card .meta .sub{font-size:12px;color:var(--ink-soft);margin-top:2px}
.tags{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.tag{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;padding:4px 10px;border-radius:999px}
.tag.nghia{background:var(--nghia-soft);color:var(--nghia)}
.tag.am{background:var(--am-soft);color:var(--am)}
.tag.neutral{background:var(--sand);color:var(--ink-soft);border:1px solid var(--border)}
.memory{margin-top:20px;padding:18px;border-radius:14px;background:var(--semantic-soft);border-left:4px solid var(--semantic)}
.memory .k{font-size:11px;text-transform:uppercase;letter-spacing:.18em;font-weight:700;color:var(--semantic);margin-bottom:8px}
.memory p{margin:0;font-size:15px;line-height:1.6}
.legend{display:flex;gap:16px;font-size:12px;color:var(--ink-soft);font-weight:500;margin:6px 0 14px;flex-wrap:wrap}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block;margin-right:6px;vertical-align:middle}
.vnote{margin-top:10px;font-size:12px;color:var(--ink-soft);background:var(--sand);border:1px dashed var(--border);border-radius:10px;padding:8px 12px}

/* puzzle */
.puzzle-board{aspect-ratio:1;width:100%;max-width:380px;margin:0 auto;position:relative;border-radius:20px;border:1px solid var(--border);background:var(--card);box-shadow:inset 0 2px 12px rgba(60,45,30,.08)}
.puzzle-slot{position:absolute;border:2px dashed var(--border);border-radius:12px;display:grid;place-items:center;transition:.18s;background:color-mix(in srgb,var(--sand) 40%,transparent)}
.puzzle-slot.is-over{border-color:var(--semantic);background:var(--semantic-soft);transform:scale(1.03)}
.puzzle-slot.is-locked{border-style:solid;border-color:var(--border);background:var(--card)}
.puzzle-slot.is-shake{animation:shake .45s;border-color:var(--danger)}
.puzzle-slot .slot-hint{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:color-mix(in srgb,var(--ink-soft) 75%,transparent);text-align:center;padding:0 8px}
.puzzle-slot .tz-glyph{font-size:clamp(3rem,13vw,5.2rem)}
.tray{display:flex;flex-wrap:wrap;gap:12px}
.puzzle-piece{width:80px;padding:12px;border-radius:16px;border:2px solid var(--border);background:var(--card);box-shadow:0 2px 8px rgba(60,45,30,.06);text-align:center;cursor:grab;transition:.15s}
.puzzle-piece:hover{transform:translateY(-2px);box-shadow:var(--shadow-pop)}
.puzzle-piece.is-selected{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 30%,transparent)}
.puzzle-piece.is-used{opacity:.3;pointer-events:none;cursor:default}
.puzzle-piece .em{font-size:20px;line-height:1}
.puzzle-piece .g{font-family:"Noto Sans SC",serif;font-size:30px;font-weight:600;margin-top:4px}
.puzzle-piece .c{font-size:10px;color:var(--ink-soft);margin-top:4px;font-family:"Noto Sans SC",serif}

.result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:640px){.result-grid{grid-template-columns:repeat(2,1fr)}}
.result-card{padding:16px;border-radius:14px;background:var(--card);border:1px solid var(--border);box-shadow:0 2px 8px rgba(60,45,30,.05)}
.result-card .rc-glyph{font-family:"Noto Sans SC",serif;font-size:46px;text-align:center;font-weight:600}
.result-card .rc-py{text-align:center;font-size:14px;font-weight:700;color:var(--primary);margin-top:2px}
.result-card .rc-mean{text-align:center;font-size:12px;color:var(--ink-soft)}
.result-card .rc-parts{margin-top:12px;padding-top:12px;border-top:1px dashed var(--border);text-align:center;font-size:12px;color:var(--ink-soft)}
.result-card .rc-parts .g{font-family:"Noto Sans SC",serif;font-size:16px}
.result-card .rc-parts .g.nghia{color:var(--nghia)}.result-card .rc-parts .g.am{color:var(--am)}

.center{text-align:center}.muted{color:var(--ink-soft)}
.util-row{margin-top:24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.quiz-glyph{margin:24px auto 0;width:190px;height:190px;border-radius:20px;background:var(--card);border:1px solid var(--border);display:grid;place-items:center;font-family:"Noto Sans SC",serif;font-size:88px;font-weight:600}
.done-box{margin-top:20px;padding:20px;border-radius:14px;background:var(--semantic-soft);border-left:4px solid var(--semantic);animation:popIn .35s}
.done-box .k{font-size:11px;text-transform:uppercase;letter-spacing:.18em;font-weight:700;color:var(--semantic);margin-bottom:6px}
.char-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.char-head .big{font-family:"Noto Sans SC",serif;font-size:30px;font-weight:700}
.char-head .info{font-size:14px;color:var(--ink-soft)}
</style>
</head>
<body>
<div class="shell">
  <div class="float-layer" aria-hidden="true">
    <div class="float-glyph font-cjk" style="top:96px;left:-16px;font-size:9rem;color:color-mix(in srgb,var(--berry) 9%,transparent)">字</div>
    <div class="float-glyph" style="top:46%;right:-8px;font-size:8rem;opacity:.08;animation-delay:1.5s">💧</div>
    <div class="float-glyph" style="bottom:40px;left:22%;font-size:6rem;opacity:.08;animation-delay:3s">🔥</div>
  </div>

  <div class="container">
    <header class="app">
      <div class="brand">
        <div class="logo">🈶<span class="spark"></span></div>
        <div>
          <h1>Hán Tự <span class="grad-text">Emoji</span></h1>
          <p>Chữ → loại chữ → phân rã → <b>công thức emoji</b> · NGHĨA 🔵 + ÂM 🔴</p>
        </div>
      </div>
      <div class="status-tag"><span class="dot"></span><span class="txt">5 chế độ · lục thư</span></div>
    </header>

    <nav class="modes" id="modeNav"></nav>
    <main class="panel"><div class="panel-bar" id="panelBar"></div><div id="panel"></div></main>

    <footer class="app">
      Nguyên tắc hiển thị: <b>NGHĨA</b> = emoji (xanh dương) · <b>ÂM</b> = chữ Hán + pinyin (đỏ) · Tượng hình = emoji lớn.
      &nbsp;Schema <code>component</code>·<code>variant</code>·<code>character</code> — chạy ngoại tuyến.
    </footer>
  </div>
</div>

<script>
/* ===== FEEDBACK ===== */
let _ac=null;
function beep(freq=880,dur=90,type="sine",gain=0.06){try{_ac=_ac||new (window.AudioContext||window.webkitAudioContext)();const c=_ac,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(gain,c.currentTime);g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+dur/1000);o.connect(g).connect(c.destination);o.start();o.stop(c.currentTime+dur/1000);}catch(e){}}
function buzz(p=25){try{navigator.vibrate&&navigator.vibrate(p);}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ===== BẢNG EMOJI BỘ THỦ (từ radical_emoji_map.json) ===== */

/* ===== CÔNG THỨC / FORMULA ===== */
function formulaChip(part){
  const c=COMPONENT[part.comp],v=variantById[part.variant];
  if(part.role==="semantic"){
    const emo=c.emoji||emojiForHan(c.canonical)||c.canonical;
    return `<span class="fchip nghia"><span class="fe">${emo}</span><span class="fvi">${esc(c.vi.split("(")[0].trim())}</span><small>NGHĨA</small></span>`;
  }
  const fade=emojiForHan(c.canonical);
  return `<span class="fchip am"><span class="fc font-cjk">${esc(v.glyph)}</span><span class="fpy">${c.pinyin}</span><small>ÂM</small>${fade?`<span class="ffade">${fade}</span>`:""}</span>`;
}
function renderFormula(ch){
  if(!ch.parts||!ch.parts.length){
    return `<div class="formula"><span class="fchip picto"><span class="fe">${ch.emoji||"❓"}</span><small>${(ch.type||"").toUpperCase()}</small></span>
      <span class="feq">=</span><span class="fbig-wrap"><span class="fbig font-cjk">${ch.glyph}</span><span class="fpy">${ch.pinyin}</span></span></div>`;
  }
  const chips=ch.parts.map(formulaChip).join('<span class="feq">+</span>');
  return `<div class="formula">${chips}<span class="feq">=</span><span class="fbig-wrap"><span class="fbig font-cjk">${ch.glyph}</span><span class="fpy">${ch.pinyin}</span></span></div>`;
}

/* ===== TIANZIGE (màu theo VAI TRÒ: NGHĨA xanh dương / ÂM đỏ) ===== */
function Tianzige(parts,dimComp){
  let cells;
  if(parts.length){
    cells=parts.map(p=>{
      const color=p.role==="semantic"?"var(--nghia)":"var(--am)";
      const dim=(dimComp&&p.comp&&p.comp!==dimComp)?"dim":"";
      return `<div class="tz-cell ${p.pos} ${dim}"><span class="tz-glyph" style="color:${color}">${esc(p.glyph)}</span></div>`;
    }).join("");
  }else cells=`<div class="tz-cell tz-full" style="inset:0;width:100%;height:100%"><span class="tz-glyph">字</span></div>`;
  return `<div class="tianzige lg"><div class="tz-hline"></div><div class="tz-vline"></div>${cells}</div>`;
}

/* ===== PART CARD (theo nguyên tắc mới) ===== */
function PartCard(part,idx){
  const c=COMPONENT[part.comp],v=variantById[part.variant];
  if(part.role==="semantic"){
    const emo=c.emoji||emojiForHan(c.canonical)||c.canonical;
    const note=!v.canonical?`<div class="vnote">${esc(v.glyph)} là dạng biến thể (${POS_LABEL[part.pos]}) của <b class="font-cjk">${esc(c.canonical)}</b> ${emo}</div>`:"";
    return `<div class="part-card nghia" data-part="${idx}">
      <div class="row">
        <div class="role-visual nghia"><span class="rv-emoji">${emo}</span></div>
        <div class="meta"><div class="head">Bộ <b class="font-cjk">${esc(c.canonical)}</b> · <b>${c.pinyin}</b> — ${esc(c.vi.split("(")[0].trim())}</div>
          <div class="sub">Thành phần tạo NGHĨA, hiển thị bằng emoji.</div></div>
      </div>
      <div class="tags"><span class="tag nghia">tạo NGHĨA</span><span class="tag neutral">${POS_LABEL[part.pos]}</span></div>
      ${note}</div>`;
  }
  const fade=emojiForHan(c.canonical);
  return `<div class="part-card am" data-part="${idx}">
    <div class="row">
      <div class="role-visual am"><span class="rv-char font-cjk">${esc(v.glyph)}</span>${fade?`<span class="rv-fade">${fade}</span>`:""}</div>
      <div class="meta"><div class="head">Chữ <b class="font-cjk">${esc(v.glyph)}</b> · <b>${c.pinyin}</b> — gợi ÂM đọc</div>
        <div class="sub">Thành phần tạo ÂM: giữ nguyên chữ Hán + pinyin${fade?`, có emoji riêng ${fade} (mờ)`:""}.</div></div>
    </div>
    <div class="tags"><span class="tag am">tạo ÂM</span><span class="tag neutral">${POS_LABEL[part.pos]}</span></div>
  </div>`;
}

        <div>
          <div class="char-head"><span class="big font-cjk">${ch.glyph}</span><span class="info">${ch.pinyin} · ${ch.meaning}</span>${typeBadge(ch.type)}</div>
          ${renderFormula(ch)}
          <div class="memory"><div class="k">Gợi ý hình tượng</div><p>${esc(ch.hint||ch.meaning)}</p></div>
        </div>
      </div></div>`,wire(){wirePills();}};
  }

  const parts=ch.parts.map(p=>({...p,glyph:variantById[p.variant].glyph}));
  return {html:`<div>
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px">${pills}</div>
    ${renderFormula(ch)}
    <div class="split">
      <div>${Tianzige(parts,analyze.dim)}
        <p class="center muted" style="margin-top:14px;font-size:14px"><span class="font-cjk" style="font-size:20px;color:var(--ink);font-weight:600">${ch.glyph}</span> · ${ch.pinyin} · ${ch.meaning}</p>
      </div>
      <div>
        <div class="char-head"><span class="info">Loại chữ:</span>${typeBadge(ch.type)}</div>
        <div class="legend"><span><i style="background:var(--nghia)"></i>NGHĨA · emoji (xanh dương)</span><span><i style="background:var(--am)"></i>ÂM · chữ + pinyin (đỏ)</span></div>
        <div style="display:flex;flex-direction:column;gap:12px">${ch.parts.map((p,i)=>PartCard(p,i)).join("")}</div>
      </div>
    </div></div>`,wire(){
    wirePills();
    document.querySelectorAll(".part-card").forEach((el,i)=>{
      el.onmouseenter=()=>{analyze.dim=ch.parts[i].comp;paintDim();};
      el.onmouseleave=()=>{analyze.dim=null;paintDim();};
    });
    function paintDim(){document.querySelectorAll(".tz-cell").forEach((cell,i)=>{const p=parts[i];if(p)cell.classList.toggle("dim",!!(analyze.dim&&p.comp!==analyze.dim));});}
  }};
  function wirePills(){document.querySelectorAll(".pill[data-g]").forEach(b=>b.onclick=()=>{analyze.glyph=b.dataset.g;analyze.dim=null;beep(700,60,"sine",0.04);mountMode();});}
}

/* ---------- LEARN ---------- */
let learn=null;
function learnInit(idx){
  const ch=CHARACTER[idx%CHARACTER.length];
  const correct=new Set(ch.parts.map(p=>p.comp));
  const distract=shuffle(Object.keys(COMPONENT).filter(id=>!correct.has(id))).slice(0,3);
  learn={idx,chips:shuffle([...correct,...distract]),selected:new Set(),status:"idle",bad:new Set()};
}
function renderLearn(){
  if(!learn) learnInit(0);
  const ch=CHARACTER[learn.idx%CHARACTER.length];
  const correct=new Set(ch.parts.map(p=>p.comp));
  if(learn.status==="done"){
    const parts=ch.parts.map(p=>({...p,glyph:variantById[p.variant].glyph}));
    return {html:`<div class="split">
      <div>${Tianzige(parts)}
        <p class="center muted" style="margin-top:14px;font-size:14px"><span class="font-cjk" style="font-size:20px;color:var(--ink);font-weight:600">${ch.glyph}</span> · ${ch.pinyin} · ${ch.meaning}</p>
      </div>
      <div>
        <div class="char-head"><span class="info">Loại chữ:</span>${typeBadge(ch.type)}</div>
        ${renderFormula(ch)}
        <div style="display:flex;flex-direction:column;gap:12px">${ch.parts.map((p,i)=>PartCard(p,i)).join("")}</div>
        <div class="memory"><div class="k">Câu ghi nhớ</div><p>${ch.memory}</p></div>
        <button class="btn-primary" id="learnNext" style="margin-top:20px">Chữ tiếp theo →</button>
      </div></div>`,wire(){document.getElementById("learnNext").onclick=()=>{learnInit(learn.idx+1);mountMode();beep(1046,90,"triangle");};}};
  }
  return {html:`<div>
    <div class="center" style="margin-bottom:26px">
      <div style="font-size:11px;text-transform:uppercase;letter-spacing:.2em;font-weight:700;color:var(--clay)">Nghĩa của chữ</div>
      <div style="font-size:34px;font-weight:700;margin-top:8px">${ch.meaning}</div>
      <div class="muted" style="font-size:14px;margin-top:4px">âm đọc: ${ch.pinyin} · gồm ${correct.size} thành phần</div>
    </div>
    <p class="center" style="font-size:15px;margin-bottom:18px;font-weight:500">Chọn <b>tất cả</b> thành phần tạo nên chữ này:</p>
    <div class="chip-grid" style="max-width:560px;margin:0 auto">
      ${learn.chips.map(id=>{const c=COMPONENT[id],on=learn.selected.has(id),bad=learn.bad.has(id);const st=bad?"is-wrong":on?"is-selected":"";
        return `<button class="radical-chip ${st}" data-id="${id}"><div class="emoji">${c.emoji||emojiForHan(c.canonical)||"🔸"}</div><div class="glyph font-cjk">${esc(c.canonical)}</div><div class="cap">${esc(c.vi.split("(")[0].trim())}</div></button>`;}).join("")}
    </div>
    <div class="center" style="margin-top:26px"><button class="btn-primary" id="learnCheck">Kiểm tra</button>
      ${learn.status==="wrong"?`<p style="color:var(--danger);margin-top:16px;font-size:14px;font-weight:500">Chưa đúng — bỏ mảnh viền đỏ và chọn lại nhé.</p>`:""}</div>
  </div>`,wire(){
    document.querySelectorAll(".radical-chip").forEach(b=>b.onclick=()=>{const id=b.dataset.id;learn.selected.has(id)?learn.selected.delete(id):learn.selected.add(id);if(learn.bad.has(id))learn.bad.delete(id);if(learn.status!=="idle")learn.status="idle";beep(660,50,"sine",0.04);mountMode();});
    document.getElementById("learnCheck").onclick=()=>{if(!learn.selected.size)return;const extra=[...learn.selected].filter(id=>!correct.has(id));const missing=[...correct].filter(id=>!learn.selected.has(id));if(!extra.length&&!missing.length){learn.status="done";beep(1175,110,"triangle");setTimeout(()=>beep(1568,160,"triangle"),110);buzz([40,60,90]);}else{learn.status="wrong";learn.bad=new Set(extra);beep(220,140,"square",0.05);buzz([15,30,15]);}mountMode();};
  }};
}

/* ---------- ASSEMBLE ---------- */
const TARGETS=["情","清","快"];
let assemble=null;
function assembleInit(t){const target=t||"情",ch=findChar(target);const correct=ch.parts.map(p=>p.variant);const pool=VARIANT.map(v=>v.id).filter(id=>!correct.includes(id));assemble={target,tray:shuffle([...correct,...shuffle(pool).slice(0,3)]),placed:{},picked:null,over:null,shake:null,done:false,attempts:0};}
function posStyle(pos){const i="8%";if(pos==="left")return `left:${i};top:${i};bottom:${i};width:calc(50% - ${i})`;if(pos==="right")return `right:${i};top:${i};bottom:${i};width:calc(50% - ${i})`;if(pos==="top")return `left:${i};right:${i};top:${i};height:calc(50% - ${i})`;return `left:${i};right:${i};bottom:${i};height:calc(50% - ${i})`;}
function renderAssemble(){
  if(!assemble) assembleInit("情");
  const A=assemble,ch=findChar(A.target);
  const slots=ch.parts.map((p,i)=>{const placed=!!A.placed[i];const glyph=placed?variantById[A.placed[i]].glyph:"";const color=p.role==="semantic"?"var(--nghia)":"var(--am)";const cls=`puzzle-slot ${A.over===i?"is-over":""} ${A.shake===i?"is-shake":""} ${placed?"is-locked":""}`;const inner=placed?`<span class="tz-glyph font-cjk" style="color:${color}">${esc(glyph)}</span>`:`<span class="slot-hint">${POS_LABEL[p.pos]}</span>`;return `<div class="${cls}" style="${posStyle(p.pos)}" data-slot="${i}">${inner}</div>`;}).join("");
  return {html:`<div class="split">
    <div><div style="transition:transform .5s;${A.done?"transform:scale(1.04)":""}"><div class="puzzle-board"><div class="tz-hline"></div><div class="tz-vline"></div>${slots}${A.done?`<div class="tz-badge">✓</div>`:""}</div></div>
      <p class="center muted" style="margin-top:14px;font-size:14px">Kéo / chạm mảnh vào ô đúng để tạo <b class="font-cjk" style="font-size:18px;color:var(--ink)">${A.target}</b> (${ch.pinyin} — ${ch.meaning})</p></div>
    <div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px">${TARGETS.map(g=>{const c=findChar(g);return `<button class="pill ${g===A.target?"active":""}" data-t="${g}">Mục tiêu: <span class="cjk font-cjk">${g}</span> ${c.pinyin}</button>`;}).join("")}</div>
      <div class="step"><span class="num">1</span><h3>Kho mảnh ghép</h3></div>
      <p class="muted" style="font-size:14px;margin-bottom:12px">Kéo mảnh vào khung, hoặc chạm 1 mảnh rồi chạm ô đích. Ghép sai không bị phạt.</p>
      <div class="tray">${A.tray.map(vId=>{const v=variantById[vId],c=COMPONENT[v.comp];const used=Object.values(A.placed).includes(vId),sel=A.picked===vId;return `<div class="puzzle-piece ${used?"is-used":""} ${sel?"is-selected":""}" data-piece="${vId}" ${used?"":'draggable="true"'} title="${esc(c.vi)} — ${POS_LABEL[v.pos]}"><div class="em">${c.emoji||emojiForHan(c.canonical)||"🔸"}</div><div class="g" style="color:${c.emoji||emojiForHan(c.canonical)?"var(--nghia)":"var(--am)"}">${esc(v.glyph)}</div><div class="c">${esc(c.canonical)}</div></div>`;}).join("")}</div>
      <div class="util-row"><button class="btn-ghost" id="asmReset">Làm lại</button><span class="muted" style="font-size:12px">Đã ghép: <b style="color:var(--ink)">${Object.keys(A.placed).length}/${ch.parts.length}</b>${A.attempts>0?` · Thử: <b style="color:var(--ink)">${A.attempts+Object.keys(A.placed).length}</b>`:""}</span></div>
      ${A.done?`<div class="done-box"><div class="k">Hoàn thành!</div><p style="font-size:15px;margin:0">✓ Bạn đã ghép ra <span class="font-cjk" style="font-size:24px;font-weight:600">${A.target}</span> — ${ch.pinyin} · ${ch.meaning}.</p><div style="margin-top:12px;display:flex;gap:12px"><button class="btn-primary" id="asmNext">Chữ tiếp theo →</button><button class="btn-ghost" id="asmAgain">Ghép lại</button></div></div>`:""}
    </div></div>`,wire(){
    function tryPlace(slot,vId){if(A.placed[slot])return;if(vId===ch.parts[slot].variant){A.placed[slot]=vId;A.picked=null;beep(880,90,"triangle");buzz(30);if(Object.keys(A.placed).length===ch.parts.length)setTimeout(()=>{A.done=true;beep(1175,110,"triangle");setTimeout(()=>beep(1568,160,"triangle"),110);buzz([40,60,90]);mountMode();},220);mountMode();}else{A.attempts++;A.shake=slot;A.picked=null;beep(220,140,"square",0.05);buzz([15,30,15]);mountMode();setTimeout(()=>{A.shake=null;mountMode();},450);}}
    document.querySelectorAll(".puzzle-piece").forEach(el=>{const vId=el.dataset.piece;el.ondragstart=e=>{e.dataTransfer.setData("text/plain",vId);e.dataTransfer.effectAllowed="move";A.picked=vId;};el.onclick=()=>{if(el.classList.contains("is-used"))return;A.picked=(A.picked===vId?null:vId);mountMode();};});
    document.querySelectorAll(".puzzle-slot").forEach(el=>{const slot=+el.dataset.slot;el.ondragover=e=>{if(!A.placed[slot]){e.preventDefault();el.classList.add("is-over");A.over=slot;}};el.ondragleave=()=>{if(A.over===slot){A.over=null;el.classList.remove("is-over");}};el.ondrop=e=>{e.preventDefault();A.over=null;const id=e.dataTransfer.getData("text/plain");if(id)tryPlace(slot,id);};el.onclick=()=>{if(A.picked&&!A.placed[slot])tryPlace(slot,A.picked);};});
    const r=document.getElementById("asmReset");if(r)r.onclick=()=>{assembleInit(A.target);mountMode();};
    document.querySelectorAll(".pill[data-t]").forEach(b=>b.onclick=()=>{assembleInit(b.dataset.t);mountMode();});
    const nx=document.getElementById("asmNext");if(nx)nx.onclick=()=>{const i=TARGETS.indexOf(A.target);assembleInit(TARGETS[(i+1)%TARGETS.length]);mountMode();};
    const ag=document.getElementById("asmAgain");if(ag)ag.onclick=()=>{assembleInit(A.target);mountMode();};
  }};
}

/* ---------- CREATE ---------- */
const PALETTE=["心","忄","⺗","水","氵","手","扌","青","可","白","夬"];
let create=null;
function renderCreate(){
  if(!create) create={picked:[],results:null};
  const C=create;
  const canonicals=[...new Set(C.picked.map(g=>COMPONENT[normalize(g)].canonical))];
  return {html:`<div>
    <p class="muted" style="font-size:14px;margin:0 0 16px">Chọn ≥ 2 mảnh (kể cả biến thể 忄/氵/扌) → tìm chữ chứa đủ các mảnh đó. Emoji hiện ra là thành phần NGHĨA.</p>
    <div class="chip-grid" style="justify-content:flex-start;gap:24px 14px">
      ${PALETTE.map(g=>{const active=C.picked.includes(g),id=normalize(g),emo=COMPONENT[id].emoji||emojiForHan(COMPONENT[id].canonical);
        return `<div style="position:relative"><button class="radical-chip ${active?"is-selected":""}" data-g="${g}" style="width:70px;padding:8px">
          <div class="emoji" style="font-size:20px">${emo||"🔸"}</div><div class="glyph font-cjk" style="font-size:22px;margin-top:4px">${esc(g)}</div></button>
          <small style="position:absolute;left:0;right:0;bottom:-19px;text-align:center;font-size:10px;font-weight:600;color:var(--ink-soft)">→ ${esc(COMPONENT[id].canonical)}</small></div>`;}).join("")}
    </div>
    <div class="muted" style="margin-top:42px;min-height:2.5rem;font-size:14px">
      ${C.picked.length?`Đã chọn: ${C.picked.map(g=>`<span style="margin-right:12px"><b class="font-cjk" style="color:var(--ink)">${esc(g)}</b> <span style="color:var(--clay)">→</span> ${esc(COMPONENT[normalize(g)].canonical)}</span>`).join("")}<div style="font-size:12px;margin-top:4px">Quy về gốc: ${canonicals.map(c=>`<b class="font-cjk" style="margin-right:4px">${esc(c)}</b>`).join("")}</div>`:"Chưa chọn mảnh nào."}
    </div>
    <div style="display:flex;gap:12px;margin-top:16px"><button class="btn-primary" id="crRun">Tìm chữ</button><button class="btn-ghost" id="crClear">Xoá chọn</button></div>
    ${C.results!==null?`<div style="margin-top:24px">${C.results.length===0?`<p class="muted" style="font-size:14px">${C.picked.length<2?"Hãy chọn ít nhất 2 mảnh.":"Không có chữ nào chứa đủ các mảnh này."}</p>`:`<div class="result-grid">${C.results.map(ch=>`<div class="result-card"><div class="rc-glyph font-cjk">${ch.glyph}</div><div class="rc-py">${ch.pinyin}</div><div class="rc-mean">${ch.meaning}</div><div class="rc-parts">${ch.parts.map((p,i)=>`${i>0?'<span style="color:var(--clay)"> + </span>':""}<span class="g ${p.role==="semantic"?"nghia":"am"} font-cjk">${esc(variantById[p.variant].glyph)}</span>`).join("")}</div></div>`).join("")}</div>`}</div>`:""}
  </div>`,wire(){
    document.querySelectorAll(".radical-chip[data-g]").forEach(b=>b.onclick=()=>{const g=b.dataset.g,i=C.picked.indexOf(g);C.picked=i>=0?C.picked.filter((_,k)=>k!==i):[...C.picked,g];C.results=null;beep(660,50,"sine",0.04);mountMode();});
    document.getElementById("crRun").onclick=()=>{if(C.picked.length<2)C.results=[];else{C.results=searchByComponents(C.picked.map(g=>normalize(g)));beep(880,90,"triangle");}mountMode();};
    document.getElementById("crClear").onclick=()=>{C.picked=[];C.results=null;mountMode();};
  }};
}

/* ---------- QUIZ ---------- */
let quiz=null;
function quizNew(){const ch=CHARACTER[Math.floor(Math.random()*CHARACTER.length)];const sem=ch.parts.find(p=>p.role==="semantic");const used=new Set(ch.parts.map(p=>p.comp));const distr=shuffle(Object.keys(COMPONENT).filter(id=>!used.has(id))).slice(0,3);return {ch,sem,options:shuffle([sem.comp,...distr])};}
function renderQuiz(){
  if(!quiz) quiz={q:quizNew(),score:{correct:0,total:0},answered:null};
  const Q=quiz,q=Q.q,v=variantById[q.sem.variant],comp=COMPONENT[q.sem.comp];
  return {html:`<div class="center">
    <div class="muted" style="font-size:14px;font-weight:600">Điểm: <b style="color:var(--primary);font-size:16px">${Q.score.correct}</b> / ${Q.score.total}</div>
    <div class="quiz-glyph">${q.ch.glyph}</div>
    <p style="margin-top:20px;font-size:15px">Chữ <b class="font-cjk" style="font-size:18px">${q.ch.glyph}</b> (${q.ch.pinyin} — ${q.ch.meaning}) được tạo NGHĨA từ bộ thủ (emoji) nào?</p>
    <div class="chip-grid" style="max-width:520px;margin:20px auto 0">
      ${q.options.map(id=>{const c=COMPONENT[id],ok=id===q.sem.comp,sel=Q.answered===id,show=Q.answered!==null;const st=show&&ok?"is-correct":show&&sel?"is-wrong":"";const emo=c.emoji||emojiForHan(c.canonical)||"🔸";
        return `<button class="radical-chip ${st}" data-id="${id}" ${Q.answered?"disabled":""}><div class="emoji" style="font-size:30px">${emo}</div><div class="cap" style="min-height:24px;margin-top:6px">${esc(c.vi.split("(")[0].trim())}</div></button>`;}).join("")}
    </div>
    ${Q.answered?`<p style="margin-top:20px;font-size:14px;font-weight:500;max-width:460px;margin-left:auto;margin-right:auto;color:${Q.answered===q.sem.comp?"var(--nghia)":"var(--danger)"}">${Q.answered===q.sem.comp?"✓ Đúng!":"✗ Chưa đúng."} Bộ <span class="font-cjk" style="color:var(--ink)">${comp.canonical}</span> ${comp.emoji||emojiForHan(comp.canonical)||""}${!v.canonical?` (viết là <span class="font-cjk" style="color:var(--ink)">${esc(v.glyph)}</span> khi ở ${POS_LABEL[q.sem.pos]})`:""} tạo nghĩa cho <span class="font-cjk" style="color:var(--ink)">${q.ch.glyph}</span>.</p><button class="btn-primary" id="quizNext" style="margin-top:20px">Câu tiếp theo</button>`:""}
  </div>`,wire(){
    document.querySelectorAll(".radical-chip[data-id]").forEach(b=>b.onclick=()=>{if(Q.answered)return;const id=b.dataset.id,ok=id===q.sem.comp;Q.answered=id;Q.score={correct:Q.score.correct+(ok?1:0),total:Q.score.total+1};if(ok){beep(1175,110,"triangle");buzz(30);}else{beep(220,140,"square",0.05);buzz([15,30,15]);}mountMode();});
    const nx=document.getElementById("quizNext");if(nx)nx.onclick=()=>{quiz.q=quizNew();quiz.answered=null;mountMode();};
  }};
}

/* ===== SHELL ===== */
let currentMode="analyze";
const RENDERERS={analyze:renderAnalyze,learn:renderLearn,assemble:renderAssemble,create:renderCreate,quiz:renderQuiz};
function mountMode(){const {html,wire}=RENDERERS[currentMode]();const panel=document.getElementById("panel");panel.innerHTML=html;if(wire)wire();}
function buildNav(){
  const nav=document.getElementById("modeNav");
  nav.innerHTML=MODES.map(m=>`<button class="mode-btn ${m.id===currentMode?"active":""}" data-mode="${m.id}"><span class="bar" style="background:${MODE_GRAD[m.id]}"></span><span class="lbl">${m.label}<span class="hint">· ${m.hint}</span></span></button>`).join("");
  nav.querySelectorAll(".mode-btn").forEach(b=>b.onclick=()=>{currentMode=b.dataset.mode;if(currentMode==="analyze")analyze=null;if(currentMode==="learn")learn=null;if(currentMode==="assemble")assemble=null;if(currentMode==="create")create=null;if(currentMode==="quiz")quiz=null;nav.querySelectorAll(".mode-btn").forEach(x=>x.classList.toggle("active",x.dataset.mode===currentMode));document.getElementById("panelBar").style.background=MODE_GRAD[currentMode];beep(740,60,"sine",0.04);mountMode();});
}
buildNav();
document.getElementById("panelBar").style.background=MODE_GRAD[currentMode];
mountMode();
</script>
</body>
</html>
