<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hán Tự Engine · Phân tích · Ghép · Sáng tạo</title>
<style>
:root{
  --sand:#f3ecdd; --sand-deep:#e4d7bd; --clay:#b46a43; --ink:#2f2a22; --ink-soft:#8a8073;
  --card:#fffdf7; --border:#e9dfca; --primary:#cf5a2c; --primary-foreground:#fff;
  --semantic:#2f9e6f; --semantic-soft:#e2f3ea; --phonetic:#3b7fc4; --phonetic-soft:#e6eef9;
  --danger:#d6455d; --berry:#c94f7c; --sun:#f2b705;
  --grad-hero:linear-gradient(120deg,#f7913d 0%,#e0567a 52%,#9a6cf0 100%);
  --shadow-pop:0 8px 20px -6px rgba(207,90,44,.45);
  --shadow-lift:0 22px 48px -16px rgba(60,40,20,.32);
  --bg:#f7f1e5;
}
@media (prefers-color-scheme: dark){
  :root{
    --sand:#2b2620; --sand-deep:#3d3529; --clay:#d68a5c; --ink:#efe8db; --ink-soft:#a89e8c;
    --card:#241f19; --border:#3a332a; --primary:#e06a3c; --primary-foreground:#fff;
    --semantic:#4bbe8a; --semantic-soft:#1e3a2e; --phonetic:#5b9dd8; --phonetic-soft:#1d2c3d;
    --danger:#e0687c; --berry:#dd6f9a; --sun:#f2c33f; --bg:#191510;
    --shadow-lift:0 22px 48px -16px rgba(0,0,0,.55);
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1100px 520px at 12% -8%, color-mix(in srgb,var(--berry) 10%, transparent), transparent),
    radial-gradient(1000px 480px at 100% 0%, color-mix(in srgb,var(--phonetic) 10%, transparent), transparent),
    var(--bg);
  color:var(--ink); min-height:100vh;
  font-family:"DM Sans","Segoe UI",Roboto,-apple-system,system-ui,sans-serif; line-height:1.5;
}
.font-cjk{font-family:"Noto Sans SC","Noto Sans CJK SC","PingFang SC","Microsoft YaHei","Songti SC",serif}
.font-display{font-family:"Space Grotesk","DM Sans",system-ui,sans-serif}
h1,h2,h3{font-family:"Space Grotesk","DM Sans",system-ui,sans-serif}
a{color:var(--clay)}
em{font-style:italic}

/* layout */
.shell{position:relative;overflow:hidden;min-height:100vh}
.container{position:relative;max-width:1100px;margin:0 auto;padding:40px 24px 60px}
@media(max-width:640px){.container{padding:24px 16px 48px}}

/* floating decorative glyphs */
.float-layer{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.float-glyph{position:absolute;font-weight:700;user-select:none;animation:float 9s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-26px)}}

/* header */
header.app{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:20px;margin-bottom:36px}
.brand{display:flex;align-items:center;gap:16px}
.logo{position:relative;width:64px;height:64px;border-radius:18px;display:grid;place-items:center;
  font-size:30px;font-weight:700;color:#fff;background:var(--grad-hero);background-size:200% 200%;
  box-shadow:var(--shadow-pop);animation:gradient 6s ease infinite}
.logo .spark{position:absolute;top:-4px;right:-4px;width:16px;height:16px;border-radius:50%;background:var(--sun);animation:glow 2s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--sun) 70%,transparent)}50%{box-shadow:0 0 0 8px transparent}}
.brand h1{margin:0;font-size:34px;letter-spacing:-.5px;font-weight:700}
.grad-text{background:var(--grad-hero);background-size:200% 200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:gradient 6s ease infinite}
.brand p{margin:6px 0 0;font-size:14px;color:var(--ink-soft)}
.brand p b{color:var(--clay);font-weight:600}
.status-tag{display:flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;background:var(--card);border:1px solid var(--border);box-shadow:0 2px 8px rgba(60,45,30,.06)}
.status-tag .dot{width:8px;height:8px;border-radius:50%;background:var(--semantic);animation:pulse 1.8s ease-in-out infinite}
.status-tag span.txt{font-size:12px;font-weight:600;color:var(--ink-soft)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@media(max-width:560px){.status-tag{display:none}.brand h1{font-size:27px}}

/* mode nav */
nav.modes{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:28px}
.mode-btn{position:relative;border:2px solid var(--border);background:var(--card);color:var(--ink-soft);
  padding:12px 18px;border-radius:16px;font-size:14px;font-weight:700;cursor:pointer;transition:.16s;overflow:hidden}
.mode-btn:hover{color:var(--ink);transform:translateY(-2px);border-color:color-mix(in srgb,var(--clay) 40%,transparent)}
.mode-btn.active{color:#fff;border-color:transparent;box-shadow:var(--shadow-pop);transform:scale(1.05)}
.mode-btn .bar{position:absolute;inset:0;background-size:200% 200%;animation:gradient 6s ease infinite;opacity:0}
.mode-btn.active .bar{opacity:1}
.mode-btn .lbl{position:relative;display:flex;align-items:center;gap:8px}
.mode-btn .hint{font-size:11px;font-weight:500;opacity:.7}
@media(max-width:680px){.mode-btn .hint{display:none}}

/* panel */
main.panel{position:relative;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(6px);
  border:2px solid color-mix(in srgb,var(--border) 70%,transparent);border-radius:32px;
  box-shadow:var(--shadow-lift);padding:44px;overflow:hidden;animation:popIn .4s cubic-bezier(.2,.8,.2,1)}
@media(max-width:640px){main.panel{padding:22px}}
.panel-bar{position:absolute;left:0;right:0;top:0;height:6px;background-size:200% 200%;animation:gradient 6s ease infinite}
@keyframes popIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
@keyframes gradient{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

footer.app{margin-top:36px;text-align:center;font-size:12px;color:var(--ink-soft)}
footer.app code{background:var(--card);border:1px solid var(--border);padding:2px 8px;border-radius:7px;color:var(--clay);font-weight:600;margin:0 2px}

/* two-column grid used by learn/analyze/assemble */
.split{display:grid;grid-template-columns:1fr 1.1fr;gap:32px;align-items:start}
@media(max-width:900px){.split{grid-template-columns:1fr;gap:26px}}

/* buttons */
.btn-primary{display:inline-flex;align-items:center;gap:8px;background:var(--grad-hero);background-size:200% 200%;
  color:#fff;font-weight:700;padding:12px 24px;border:none;border-radius:16px;cursor:pointer;
  box-shadow:var(--shadow-pop);animation:gradient 6s ease infinite;transition:transform .15s,box-shadow .2s}
.btn-primary:hover{transform:translateY(-2px) scale(1.02);box-shadow:var(--shadow-lift)}
.btn-primary:active{transform:translateY(0)}
.btn-ghost{display:inline-flex;align-items:center;background:var(--card);color:var(--ink);border:2px solid var(--border);
  font-weight:700;padding:10px 22px;border-radius:16px;cursor:pointer;transition:.15s}
.btn-ghost:hover{background:var(--sand);border-color:var(--clay);transform:translateY(-1px)}

/* pill */
.pill{padding:8px 16px;border-radius:999px;font-size:14px;font-weight:500;border:1px solid var(--border);
  background:var(--sand);color:var(--ink);cursor:pointer;transition:.14s}
.pill:hover{border-color:var(--sand-deep);background:color-mix(in srgb,var(--sand-deep) 25%,transparent)}
.pill.active{background:var(--primary);color:var(--primary-foreground);border-color:var(--primary);box-shadow:0 3px 8px rgba(0,0,0,.12)}
.pill .cjk{font-family:"Noto Sans SC",serif;margin-right:4px;font-size:16px}

/* step label */
.step{display:flex;align-items:center;gap:8px;margin:26px 0 12px}
.step:first-child{margin-top:0}
.step .num{width:24px;height:24px;border-radius:50%;background:var(--primary);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}
.step h3{margin:0;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.18em;color:var(--clay)}

/* tianzige 田字格 */
.tianzige{position:relative;margin:0 auto;border-radius:20px;border:1px solid var(--border);background:var(--card);
  box-shadow:inset 0 2px 12px rgba(60,45,30,.08)}
.tianzige.lg{aspect-ratio:1;width:100%;max-width:400px}
.tianzige.md{width:190px;height:190px}
.tz-hline{position:absolute;left:16px;right:16px;top:50%;height:1px;
  background:repeating-linear-gradient(to right,var(--sand-deep) 0 6px,transparent 6px 14px)}
.tz-vline{position:absolute;top:16px;bottom:16px;left:50%;width:1px;
  background:repeating-linear-gradient(to bottom,var(--sand-deep) 0 6px,transparent 6px 14px)}
.tz-cell{position:absolute;display:flex;align-items:center;justify-content:center;padding:12px;transition:all .3s}
.tz-cell.left{left:0;top:0;bottom:0;width:50%}
.tz-cell.right{right:0;top:0;bottom:0;width:50%}
.tz-cell.top{left:0;right:0;top:0;height:50%}
.tz-cell.bottom{left:0;right:0;bottom:0;height:50%}
.tz-glyph{font-family:"Noto Sans SC",serif;font-weight:600;line-height:1}
.tianzige.lg .tz-glyph{font-size:clamp(3.4rem,15vw,6.2rem)}
.tianzige.md .tz-glyph{font-size:3.4rem}
.tz-cell.dim{opacity:.22}
.tz-full .tz-glyph{font-size:8.5rem;color:color-mix(in srgb,var(--sand-deep) 60%,transparent)}
.tz-badge{position:absolute;right:-12px;bottom:-12px;width:56px;height:56px;border-radius:50%;
  background:var(--semantic);color:#fff;display:grid;place-items:center;font-size:26px;font-weight:700;
  box-shadow:var(--shadow-lift);animation:popIn .3s}

/* radical chip */
.chip-grid{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.radical-chip{width:96px;padding:12px;border-radius:14px;border:2px solid var(--border);background:var(--sand);
  cursor:pointer;transition:.15s;text-align:center;display:flex;flex-direction:column;align-items:center}
.radical-chip:hover{transform:translateY(-2px);box-shadow:var(--shadow-pop)}
.radical-chip.is-selected{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 12%,var(--card));transform:translateY(-3px);box-shadow:var(--shadow-pop)}
.radical-chip.is-wrong{border-color:var(--danger);background:color-mix(in srgb,var(--danger) 12%,var(--card));animation:shake .4s}
.radical-chip.is-correct{border-color:var(--semantic);background:var(--semantic-soft)}
.radical-chip .emoji{font-size:26px;line-height:1}
.radical-chip .glyph{font-family:"Noto Sans SC",serif;font-size:22px;font-weight:600;margin-top:8px}
.radical-chip .cap{font-size:11px;color:var(--ink-soft);margin-top:4px;min-height:26px}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}

/* part card */
.part-card{padding:16px;border-radius:14px;background:var(--card);border:1px solid var(--border);border-left:4px solid var(--border);
  box-shadow:0 2px 8px rgba(60,45,30,.05);transition:.2s}
.part-card:hover{box-shadow:0 6px 16px rgba(60,45,30,.1)}
.part-card.sem{border-left-color:var(--semantic)}
.part-card.pho{border-left-color:var(--phonetic)}
.part-card .row{display:flex;align-items:baseline;gap:12px}
.part-card .big{font-family:"Noto Sans SC",serif;font-size:38px;font-weight:600}
.part-card .big.sem{color:var(--semantic)}.part-card .big.pho{color:var(--phonetic)}
.part-card .desc{font-size:14px;color:var(--ink-soft)}
.part-card .desc b{color:var(--ink)}
.part-card .desc .em{font-size:18px;margin-right:4px}
.tags{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.tag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:4px 10px;border-radius:999px}
.tag.sem{background:var(--semantic-soft);color:var(--semantic)}
.tag.pho{background:var(--phonetic-soft);color:var(--phonetic)}
.tag.neutral{background:var(--sand);color:var(--ink-soft);border:1px solid var(--border)}
.memory{margin-top:22px;padding:20px;border-radius:14px;background:var(--semantic-soft);border-left:4px solid var(--semantic)}
.memory .k{font-size:11px;text-transform:uppercase;letter-spacing:.18em;font-weight:700;color:var(--semantic);margin-bottom:8px}
.memory p{margin:0;font-size:15px;line-height:1.6}
.legend{display:flex;gap:16px;font-size:12px;color:var(--ink-soft);font-weight:500;margin:8px 0 16px;flex-wrap:wrap}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block;margin-right:6px;vertical-align:middle}

/* puzzle */
.puzzle-board{aspect-ratio:1;width:100%;max-width:400px;margin:0 auto;position:relative;border-radius:20px;border:1px solid var(--border);background:var(--card);box-shadow:inset 0 2px 12px rgba(60,45,30,.08)}
.puzzle-slot{position:absolute;border:2px dashed var(--border);border-radius:12px;display:grid;place-items:center;transition:.18s;background:color-mix(in srgb,var(--sand) 40%,transparent)}
.puzzle-slot.is-over{border-color:var(--semantic);background:var(--semantic-soft);transform:scale(1.03)}
.puzzle-slot.is-locked{border-style:solid;border-color:var(--border);background:var(--card)}
.puzzle-slot.is-shake{animation:shake .45s;border-color:var(--danger)}
.puzzle-slot .slot-hint{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:color-mix(in srgb,var(--ink-soft) 75%,transparent);text-align:center;padding:0 8px}
.puzzle-slot .tz-glyph{font-size:clamp(3rem,13vw,5.4rem)}
.tray{display:flex;flex-wrap:wrap;gap:12px}
.puzzle-piece{width:80px;padding:12px;border-radius:16px;border:2px solid var(--border);background:var(--card);
  box-shadow:0 2px 8px rgba(60,45,30,.06);text-align:center;cursor:grab;transition:.15s}
.puzzle-piece:hover{transform:translateY(-2px);box-shadow:var(--shadow-pop)}
.puzzle-piece.is-selected{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 30%,transparent)}
.puzzle-piece.is-used{opacity:.3;pointer-events:none;cursor:default}
.puzzle-piece .em{font-size:20px;line-height:1}
.puzzle-piece .g{font-family:"Noto Sans SC",serif;font-size:30px;font-weight:600;margin-top:4px}
.puzzle-piece .c{font-size:10px;color:var(--ink-soft);margin-top:4px;font-family:"Noto Sans SC",serif}

/* create results */
.result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:640px){.result-grid{grid-template-columns:repeat(2,1fr)}}
.result-card{padding:16px;border-radius:14px;background:var(--card);border:1px solid var(--border);box-shadow:0 2px 8px rgba(60,45,30,.05)}
.result-card .rc-glyph{font-family:"Noto Sans SC",serif;font-size:46px;text-align:center;font-weight:600}
.result-card .rc-py{text-align:center;font-size:14px;font-weight:700;color:var(--primary);margin-top:2px}
.result-card .rc-mean{text-align:center;font-size:12px;color:var(--ink-soft)}
.result-card .rc-parts{margin-top:12px;padding-top:12px;border-top:1px dashed var(--border);text-align:center;font-size:12px;color:var(--ink-soft)}
.result-card .rc-parts .g{font-family:"Noto Sans SC",serif;font-size:16px}
.result-card .rc-parts .g.sem{color:var(--semantic)}.result-card .rc-parts .g.pho{color:var(--phonetic)}

.center{text-align:center}
.muted{color:var(--ink-soft)}
.pop-in{animation:popIn .35s}
.util-row{margin-top:24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.quiz-glyph{margin:24px auto 0;width:190px;height:190px;border-radius:20px;background:var(--card);border:1px solid var(--border);
  display:grid;place-items:center;font-family:"Noto Sans SC",serif;font-size:88px;font-weight:600;box-shadow:0 2px 8px rgba(60,45,30,.06)}
.done-box{margin-top:20px;padding:20px;border-radius:14px;background:var(--semantic-soft);border-left:4px solid var(--semantic);animation:popIn .35s}
.done-box .k{font-size:11px;text-transform:uppercase;letter-spacing:.18em;font-weight:700;color:var(--semantic);margin-bottom:6px}
</style>
</head>
<body>
<div class="shell">
  <div class="float-layer" aria-hidden="true">
    <div class="float-glyph font-cjk" style="top:96px;left:-16px;font-size:9rem;color:color-mix(in srgb,var(--berry) 9%,transparent)">字</div>
    <div class="float-glyph font-cjk" style="top:48%;right:-32px;font-size:11rem;color:color-mix(in srgb,var(--phonetic) 9%,transparent);animation-delay:1.5s">心</div>
    <div class="float-glyph font-cjk" style="bottom:40px;left:24%;font-size:7rem;color:color-mix(in srgb,var(--semantic) 9%,transparent);animation-delay:3s">水</div>
  </div>

  <div class="container">
    <header class="app">
      <div class="brand">
        <div class="logo font-cjk">字<span class="spark"></span></div>
        <div>
          <h1>Hán Tự <span class="grad-text">Engine</span></h1>
          <p>Phân tích · Ghép · Sáng tạo — mô hình <b>component · variant · structure</b></p>
        </div>
      </div>
      <div class="status-tag">
        <span class="dot"></span><span class="txt">5 chế độ · học tương tác</span>
      </div>
    </header>

    <nav class="modes" id="modeNav"></nav>

    <main class="panel">
      <div class="panel-bar" id="panelBar"></div>
      <div id="panel"></div>
    </main>

    <footer class="app">
      Schema:
      <code>character</code>·<code>component</code>·<code>variant</code>·<code>structure</code>
      &nbsp;—&nbsp; port từ thiết kế “Hán Tự Engine”, chạy ngoại tuyến.
    </footer>
  </div>
</div>

<script>
/* ============================================================
   FEEDBACK: âm thanh + rung
   ============================================================ */
let _ac=null;
function beep(freq=880,dur=90,type="sine",gain=0.06){
  try{
    _ac=_ac||new (window.AudioContext||window.webkitAudioContext)();
    const ctx=_ac,o=ctx.createOscillator(),g=ctx.createGain();
    o.type=type;o.frequency.value=freq;
    g.gain.setValueAtTime(gain,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+dur/1000);
    o.connect(g).connect(ctx.destination);o.start();o.stop(ctx.currentTime+dur/1000);
  }catch(e){}
}
function buzz(p=25){try{navigator.vibrate&&navigator.vibrate(p);}catch(e){}}

/* ============================================================
   DỮ LIỆU: component · variant · character  (dựng lại theo schema gốc)
   ============================================================ */
const COMPONENT={
  heart:{canonical:"心",emoji:"❤️",meaning:"trái tim, cảm xúc (bộ Tâm)"},
  water:{canonical:"水",emoji:"💧",meaning:"nước (bộ Thủy)"},
  hand:{canonical:"手",emoji:"✋",meaning:"bàn tay (bộ Thủ)"},
  sun:{canonical:"日",emoji:"☀️",meaning:"mặt trời, ngày (bộ Nhật)"},
  moon:{canonical:"月",emoji:"🌙",meaning:"mặt trăng, tháng (bộ Nguyệt)"},
  tree:{canonical:"木",emoji:"🌳",meaning:"cây, gỗ (bộ Mộc)"},
  woman:{canonical:"女",emoji:"👩",meaning:"nữ, con gái (bộ Nữ)"},
  qing:{canonical:"青",emoji:"🟢",meaning:"xanh — thường gợi ÂM (thanh)"},
  ke:{canonical:"可",emoji:"🗯️",meaning:"có thể — gợi ÂM (khả)"},
  gong:{canonical:"工",emoji:"🛠️",meaning:"công việc — gợi ÂM (công)"},
  bai:{canonical:"白",emoji:"⚪",meaning:"trắng — gợi ÂM (bạch)"},
  guai:{canonical:"夬",emoji:"➰",meaning:"quải — gợi ÂM"},
  ma:{canonical:"马",emoji:"🐴",meaning:"ngựa — gợi ÂM (mã)"},
  yang:{canonical:"羊",emoji:"🐑",meaning:"dê — gợi ÂM (dương)"},
  wang:{canonical:"亡",emoji:"🚷",meaning:"mất — gợi ÂM (vong)"},
  ding:{canonical:"丁",emoji:"📌",meaning:"đinh — gợi ÂM (đinh)"},
};
const COMP_COLOR={
  heart:"#d6455d",water:"#2f8fce",hand:"#c9812a",sun:"#e0a020",moon:"#7a6cc4",
  tree:"#3a9d5d",woman:"#cf5ea8",qing:"#2aa889",ke:"#b06a3a",gong:"#6b8e9e",
  bai:"#9a8f7a",guai:"#a06cc4",ma:"#b5642f",yang:"#7c9a3e",wang:"#8a8073",ding:"#8a8073",
};
const VARIANT=[
  {id:"heart_l",glyph:"忄",comp:"heart",pos:"left",canonical:false},
  {id:"heart_b",glyph:"心",comp:"heart",pos:"bottom",canonical:true},
  {id:"water_l",glyph:"氵",comp:"water",pos:"left",canonical:false},
  {id:"hand_l",glyph:"扌",comp:"hand",pos:"left",canonical:false},
  {id:"sun_l",glyph:"日",comp:"sun",pos:"left",canonical:true},
  {id:"moon_r",glyph:"月",comp:"moon",pos:"right",canonical:true},
  {id:"tree_l",glyph:"木",comp:"tree",pos:"left",canonical:true},
  {id:"tree_r",glyph:"木",comp:"tree",pos:"right",canonical:true},
  {id:"woman_l",glyph:"女",comp:"woman",pos:"left",canonical:true},
  {id:"qing_r",glyph:"青",comp:"qing",pos:"right",canonical:true},
  {id:"ke_r",glyph:"可",comp:"ke",pos:"right",canonical:true},
  {id:"gong_r",glyph:"工",comp:"gong",pos:"right",canonical:true},
  {id:"bai_r",glyph:"白",comp:"bai",pos:"right",canonical:true},

const POS_LABEL={left:"bên trái",right:"bên phải",top:"phía trên",bottom:"phía dưới"};
const ROLE_LABEL={semantic:"tạo NGHĨA",phonetic:"tạo ÂM"};

/* bản đồ glyph → component id (gồm cả biến thể + biến thể mở rộng) */
const NORMALIZE={"心":"heart","忄":"heart","⺗":"heart","水":"water","氵":"water","氺":"water",
  "手":"hand","扌":"hand","日":"sun","月":"moon","木":"tree","女":"woman","青":"qing","可":"ke",
  "工":"gong","白":"bai","夬":"guai","马":"ma","羊":"yang","亡":"wang","丁":"ding"};
function normalize(g){return NORMALIZE[g]||null;}
function findChar(g){return CHARACTER.find(c=>c.glyph===g)||null;}
function searchByComponents(ids){
  return CHARACTER.filter(c=>ids.every(id=>c.parts.some(p=>p.comp===id)));
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

/* ============================================================
   THÀNH PHẦN DÙNG CHUNG (trả về HTML)
   ============================================================ */
function Tianzige(parts,size,dimComp){
  size=size||"lg";
  const cls="tianzige "+size;
  let cells="";
  if(parts.length){
    cells=parts.map(p=>{
      const color=p.comp?COMP_COLOR[p.comp]:(p.role==="semantic"?"var(--semantic)":"var(--phonetic)");
      const dim=(dimComp&&p.comp&&p.comp!==dimComp)?"dim":"";
      return `<div class="tz-cell ${p.pos} ${dim}"><span class="tz-glyph" style="color:${color}">${esc(p.glyph)}</span></div>`;
    }).join("");
  }else{
    cells=`<div class="tz-cell tz-full" style="inset:0;width:100%;height:100%"><span class="tz-glyph">字</span></div>`;
  }
  return `<div class="${cls}"><div class="tz-hline"></div><div class="tz-vline"></div>${cells}</div>`;
}
function PartCard(part,idx){
  const v=variantById[part.variant],c=COMPONENT[part.comp];
  const isSem=part.role==="semantic";
  const rc=isSem?"sem":"pho";
  return `<div class="part-card ${rc}" data-part="${idx}">
    <div class="row">
      <div class="big ${rc} font-cjk">${esc(v.glyph)}</div>
      <div class="desc">
        <span class="em">${c.emoji}</span>Biến thể <b class="font-cjk">${esc(v.glyph)}</b> ← gốc <b class="font-cjk">${esc(c.canonical)}</b>
        <div style="font-size:12px">${esc(c.meaning)}</div>
      </div>
    </div>
    <div class="tags">
      <span class="tag ${rc}">${ROLE_LABEL[part.role]}</span>
      <span class="tag neutral">${POS_LABEL[part.pos]}</span>
      ${!v.canonical?`<span class="tag neutral">biến thể</span>`:""}
    </div>
  </div>`;
}

  const ch=CHARACTER[idx%CHARACTER.length];
  const correct=new Set(ch.parts.map(p=>p.comp));
  const distract=shuffle(Object.keys(COMPONENT).filter(id=>!correct.has(id))).slice(0,3);
  learn={idx,chips:shuffle([...correct,...distract]),selected:new Set(),status:"idle",bad:new Set()};
}
function renderLearn(){
  if(!learn) learnInit(0);
  const ch=CHARACTER[learn.idx%CHARACTER.length];
  const correct=new Set(ch.parts.map(p=>p.comp));

  if(learn.status==="done"){
    const parts=ch.parts.map(p=>({...p,glyph:variantById[p.variant].glyph}));
    return {html:`<div class="split">

      </div>

    }};
  }

  return {html:`<div>
    <div class="center" style="margin-bottom:28px">
      <div style="font-size:11px;text-transform:uppercase;letter-spacing:.2em;font-weight:700;color:var(--clay)">Nghĩa của chữ</div>
      <div class="font-display" style="font-size:34px;font-weight:700;margin-top:8px">${ch.meaning}</div>
      <div class="muted" style="font-size:14px;margin-top:4px">âm đọc: ${ch.pinyin} · gồm ${correct.size} thành phần</div>
    </div>
    <p class="center" style="font-size:15px;margin-bottom:18px;font-weight:500">Chọn <b>tất cả</b> thành phần tạo nên chữ này:</p>
    <div class="chip-grid" style="max-width:560px;margin:0 auto">
      ${learn.chips.map(id=>{
        const c=COMPONENT[id],on=learn.selected.has(id),isBad=learn.bad.has(id);
        const st=isBad?"is-wrong":on?"is-selected":"";
        return `<button class="radical-chip ${st}" data-id="${id}">
          <div class="emoji">${c.emoji}</div>
          <div class="glyph font-cjk" style="color:${isBad?"var(--danger)":COMP_COLOR[id]}">${esc(c.canonical)}</div>
          <div class="cap">${esc(c.meaning.split("(")[0].trim())}</div></button>`;
      }).join("")}
    </div>
    <div class="center" style="margin-top:28px">
      <button class="btn-primary" id="learnCheck">Kiểm tra</button>
      ${learn.status==="wrong"?`<p style="color:var(--danger);margin-top:16px;font-size:14px;font-weight:500">Chưa đúng — bỏ mảnh viền đỏ và chọn lại nhé.</p>`:""}
    </div>
  </div>`,wire(){
    document.querySelectorAll(".radical-chip").forEach(b=>b.onclick=()=>{
      const id=b.dataset.id;
      learn.selected.has(id)?learn.selected.delete(id):learn.selected.add(id);
      if(learn.bad.has(id))learn.bad.delete(id);
      if(learn.status!=="idle")learn.status="idle";
      beep(660,50,"sine",0.04);mountMode();
    });
    document.getElementById("learnCheck").onclick=()=>{
      if(!learn.selected.size)return;
      const extra=[...learn.selected].filter(id=>!correct.has(id));

      if(!extra.length&&!missing.length){learn.status="done";beep(1175,110,"triangle");setTimeout(()=>beep(1568,160,"triangle"),110);buzz([40,60,90]);}
      else{learn.status="wrong";learn.bad=new Set(extra);beep(220,140,"square",0.05);buzz([15,30,15]);}
      mountMode();
    };
  }};
}

/* ---------------- ASSEMBLE ---------------- */
const TARGETS=["情","清","快"];
let assemble=null;
function assembleInit(t){
  const target=t||"情";const ch=findChar(target);
  const correct=ch.parts.map(p=>p.variant);
  const pool=VARIANT.map(v=>v.id).filter(id=>!correct.includes(id));
  const tray=shuffle([...correct,...shuffle(pool).slice(0,3)]);
  assemble={target,tray,placed:{},picked:null,over:null,shake:null,done:false,attempts:0};
}
function posStyle(pos){
  const i="8%";
  if(pos==="left")return `left:${i};top:${i};bottom:${i};width:calc(50% - ${i})`;
  if(pos==="right")return `right:${i};top:${i};bottom:${i};width:calc(50% - ${i})`;
  if(pos==="top")return `left:${i};right:${i};top:${i};height:calc(50% - ${i})`;
  return `left:${i};right:${i};bottom:${i};height:calc(50% - ${i})`;
}
function renderAssemble(){
  if(!assemble) assembleInit("情");
  const A=assemble,ch=findChar(A.target);
  const slots=ch.parts.map((p,i)=>{
    const isPlaced=!!A.placed[i];
    const glyph=isPlaced?variantById[A.placed[i]].glyph:"";
    const color=COMP_COLOR[p.comp];
    const cls=`puzzle-slot ${A.over===i?"is-over":""} ${A.shake===i?"is-shake":""} ${isPlaced?"is-locked":""}`;
    const inner=isPlaced?`<span class="tz-glyph font-cjk" style="color:${color}">${esc(glyph)}</span>`
      :`<span class="slot-hint">${POS_LABEL[p.pos]}</span>`;
    return `<div class="${cls}" style="${posStyle(p.pos)}" data-slot="${i}">${inner}</div>`;
  }).join("");
  return {html:`<div class="split">
    <div>
      <div style="transition:transform .5s;${A.done?"transform:scale(1.04)":""}">
        <div class="puzzle-board">
          <div class="tz-hline"></div><div class="tz-vline"></div>
          ${slots}
          ${A.done?`<div class="tz-badge">✓</div>`:""}
        </div>
      </div>
      <p class="center muted" style="margin-top:16px;font-size:14px">Kéo / chạm mảnh vào ô đúng để tạo
        <b class="font-cjk" style="font-size:18px;color:var(--ink)">${A.target}</b> (${ch.pinyin} — ${ch.meaning})</p>
    </div>
    <div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px">
        ${TARGETS.map(g=>{const c=findChar(g);return `<button class="pill ${g===A.target?"active":""}" data-t="${g}">Mục tiêu: <span class="cjk font-cjk">${g}</span> ${c.pinyin}</button>`;}).join("")}
      </div>
      <div class="step"><span class="num">1</span><h3>Kho mảnh ghép</h3></div>
      <p class="muted" style="font-size:14px;margin-bottom:12px">Kéo mảnh vào khung bên trái, hoặc chạm 1 mảnh rồi chạm ô đích. Ghép sai không bị phạt — cứ thử lại.</p>
      <div class="tray">
        ${A.tray.map(vId=>{
          const v=variantById[vId],c=COMPONENT[v.comp];
          const used=Object.values(A.placed).includes(vId),sel=A.picked===vId;
          return `<div class="puzzle-piece ${used?"is-used":""} ${sel?"is-selected":""}" data-piece="${vId}" ${used?"":'draggable="true"'} title="${esc(c.meaning)} — ${POS_LABEL[v.pos]}">
            <div class="em">${c.emoji}</div>
            <div class="g" style="color:${COMP_COLOR[v.comp]}">${esc(v.glyph)}</div>
            <div class="c">${esc(c.canonical)}</div></div>`;
        }).join("")}
      </div>
      <div class="util-row">
        <button class="btn-ghost" id="asmReset">Làm lại</button>
        <span class="muted" style="font-size:12px">Đã ghép: <b style="color:var(--ink)">${Object.keys(A.placed).length}/${ch.parts.length}</b>${A.attempts>0?` · Thử: <b style="color:var(--ink)">${A.attempts+Object.keys(A.placed).length}</b>`:""}</span>
      </div>
      ${A.done?`<div class="done-box"><div class="k">Hoàn thành!</div>
        <p style="font-size:15px;margin:0">✓ Bạn đã ghép ra <span class="font-cjk" style="font-size:24px;font-weight:600">${A.target}</span> — ${ch.pinyin} · ${ch.meaning}.</p>
        <div style="margin-top:12px;display:flex;gap:12px"><button class="btn-primary" id="asmNextChar">Chữ tiếp theo →</button><button class="btn-ghost" id="asmAgain">Ghép lại</button></div></div>`:""}
    </div>
  </div>`,wire(){
    const board=document.querySelector("#panel");
    function tryPlace(slot,vId){
      if(A.placed[slot])return;
      const expected=ch.parts[slot].variant;
      if(vId===expected){
        A.placed[slot]=vId;A.picked=null;beep(880,90,"triangle");buzz(30);
        if(Object.keys(A.placed).length===ch.parts.length){
          setTimeout(()=>{A.done=true;beep(1175,110,"triangle");setTimeout(()=>beep(1568,160,"triangle"),110);buzz([40,60,90]);mountMode();},220);
        }
        mountMode();
      }else{
        A.attempts++;A.shake=slot;A.picked=null;beep(220,140,"square",0.05);buzz([15,30,15]);
        mountMode();setTimeout(()=>{A.shake=null;mountMode();},450);
      }
    }
    document.querySelectorAll(".puzzle-piece").forEach(el=>{
      const vId=el.dataset.piece;
      el.ondragstart=e=>{e.dataTransfer.setData("text/plain",vId);e.dataTransfer.effectAllowed="move";A.picked=vId;};
      el.onclick=()=>{if(el.classList.contains("is-used"))return;A.picked=(A.picked===vId?null:vId);mountMode();};
    });
    document.querySelectorAll(".puzzle-slot").forEach(el=>{
      const slot=+el.dataset.slot;
      el.ondragover=e=>{if(!A.placed[slot]){e.preventDefault();if(A.over!==slot){A.over=slot;el.classList.add("is-over");}}};
      el.ondragleave=()=>{if(A.over===slot){A.over=null;el.classList.remove("is-over");}};
      el.ondrop=e=>{e.preventDefault();A.over=null;const id=e.dataTransfer.getData("text/plain");if(id)tryPlace(slot,id);};
      el.onclick=()=>{if(A.picked&&!A.placed[slot])tryPlace(slot,A.picked);};
    });
    const reset=document.getElementById("asmReset");if(reset)reset.onclick=()=>{assembleInit(A.target);mountMode();};
    document.querySelectorAll(".pill[data-t]").forEach(b=>b.onclick=()=>{assembleInit(b.dataset.t);mountMode();});
    const nx=document.getElementById("asmNextChar");if(nx)nx.onclick=()=>{const i=TARGETS.indexOf(A.target);assembleInit(TARGETS[(i+1)%TARGETS.length]);mountMode();};
    const ag=document.getElementById("asmAgain");if(ag)ag.onclick=()=>{assembleInit(A.target);mountMode();};
  }};
}

        return `<div style="position:relative">
          <button class="radical-chip ${active?"is-selected":""}" data-g="${g}" style="width:64px;height:64px;padding:0;display:grid;place-items:center">
            <span class="font-cjk" style="font-size:24px;font-weight:500;color:${COMP_COLOR[id]}">${esc(g)}</span></button>
          <small style="position:absolute;left:0;right:0;bottom:-19px;text-align:center;font-size:10px;font-weight:600;color:var(--ink-soft)">→ ${esc(COMPONENT[id].canonical)}</small>
        </div>`;
      }).join("")}
    </div>
    <div class="muted" style="margin-top:40px;min-height:3rem;font-size:14px">
      ${C.picked.length?`Đã chọn: ${C.picked.map(g=>`<span style="margin-right:12px"><b class="font-cjk" style="color:var(--ink)">${esc(g)}</b> <span style="color:var(--clay)">→</span> ${esc(COMPONENT[normalize(g)].canonical)}</span>`).join("")}
        <div style="font-size:12px;margin-top:4px">Quy về thành phần gốc: ${canonicals.map(c=>`<b class="font-cjk" style="margin-right:4px">${esc(c)}</b>`).join("")}</div>`
        :"Chưa chọn mảnh nào."}
    </div>
    <div style="display:flex;gap:12px;margin-top:16px">
      <button class="btn-primary" id="crRun">Tìm chữ</button>
      <button class="btn-ghost" id="crClear">Xoá chọn</button>
    </div>
    ${C.results!==null?`<div style="margin-top:24px">${
      C.results.length===0
        ?`<p class="muted" style="font-size:14px">${C.picked.length<2?"Hãy chọn ít nhất 2 mảnh để tìm chữ.":"Không có chữ nào chứa đủ các mảnh này."}</p>`
        :`<div class="result-grid">${C.results.map(ch=>`<div class="result-card">
            <div class="rc-glyph font-cjk">${ch.glyph}</div>
            <div class="rc-py">${ch.pinyin}</div><div class="rc-mean">${ch.meaning}</div>
            <div class="rc-parts">${ch.parts.map((p,i)=>`${i>0?'<span style="color:var(--clay)"> + </span>':""}<span class="g ${p.role==="semantic"?"sem":"pho"} font-cjk">${esc(variantById[p.variant].glyph)}</span>`).join("")}</div>
          </div>`).join("")}</div>`
    }</div>`:""}
  </div>`,wire(){
    document.querySelectorAll(".radical-chip[data-g]").forEach(b=>b.onclick=()=>{
      const g=b.dataset.g,i=C.picked.indexOf(g);
      C.picked=i>=0?C.picked.filter((_,k)=>k!==i):[...C.picked,g];C.results=null;beep(660,50,"sine",0.04);mountMode();
    });
    document.getElementById("crRun").onclick=()=>{
      if(C.picked.length<2){C.results=[];}
      else{C.results=searchByComponents(C.picked.map(g=>normalize(g)));beep(880,90,"triangle");}
      mountMode();
    };
    document.getElementById("crClear").onclick=()=>{C.picked=[];C.results=null;mountMode();};
  }};
}

/* ---------------- QUIZ ---------------- */
let quiz=null;
function quizNew(){
  const ch=CHARACTER[Math.floor(Math.random()*CHARACTER.length)];
  const sem=ch.parts.find(p=>p.role==="semantic");
  const used=new Set(ch.parts.map(p=>p.comp));
  const distr=shuffle(Object.keys(COMPONENT).filter(id=>!used.has(id))).slice(0,3);
  return {ch,sem,options:shuffle([sem.comp,...distr])};
}
function renderQuiz(){
  if(!quiz) quiz={q:quizNew(),score:{correct:0,total:0},answered:null};
  const Q=quiz,q=Q.q,v=variantById[q.sem.variant],comp=COMPONENT[q.sem.comp];
  return {html:`<div class="center">
    <div class="muted" style="font-size:14px;font-weight:600">Điểm: <b style="color:var(--primary);font-size:16px">${Q.score.correct}</b> / ${Q.score.total}</div>
    <div class="quiz-glyph">${q.ch.glyph}</div>
    <p style="margin-top:20px;font-size:15px">Chữ <b class="font-cjk" style="font-size:18px">${q.ch.glyph}</b> (${q.ch.pinyin} — ${q.ch.meaning}) được tạo từ bộ thủ nào?</p>
    <div class="chip-grid" style="max-width:520px;margin:20px auto 0">
      ${q.options.map(id=>{
        const c=COMPONENT[id],isCorrect=id===q.sem.comp,isSel=Q.answered===id,show=Q.answered!==null;
        const st=show&&isCorrect?"is-correct":show&&isSel?"is-wrong":"";
        const col=show&&isSel&&!isCorrect?"var(--danger)":COMP_COLOR[id];
        return `<button class="radical-chip ${st}" data-id="${id}" ${Q.answered?"disabled":""}>
          <div class="glyph font-cjk" style="font-size:30px;color:${col}">${esc(c.canonical)}</div>
          <div class="cap" style="min-height:28px">${esc(c.meaning.split("(")[0].trim())}</div></button>`;
      }).join("")}
    </div>
    ${Q.answered?`<p style="margin-top:20px;font-size:14px;font-weight:500;max-width:460px;margin-left:auto;margin-right:auto;color:${Q.answered===q.sem.comp?"var(--semantic)":"var(--danger)"}">
        ${Q.answered===q.sem.comp?"✓ Đúng!":"✗ Chưa đúng."} Bộ <span class="font-cjk" style="color:var(--ink)">${comp.canonical}</span>${!v.canonical?` (viết là <span class="font-cjk" style="color:var(--ink)">${esc(v.glyph)}</span> khi ở ${POS_LABEL[q.sem.pos]})`:""} tạo nghĩa cho <span class="font-cjk" style="color:var(--ink)">${q.ch.glyph}</span>.</p>
      <button class="btn-primary" id="quizNext" style="margin-top:22px">Câu tiếp theo</button>`:""}
  </div>`,wire(){
    document.querySelectorAll(".radical-chip[data-id]").forEach(b=>b.onclick=()=>{
      if(Q.answered)return;
      const id=b.dataset.id,ok=id===q.sem.comp;
      Q.answered=id;Q.score={correct:Q.score.correct+(ok?1:0),total:Q.score.total+1};
      if(ok){beep(1175,110,"triangle");buzz(30);}else{beep(220,140,"square",0.05);buzz([15,30,15]);}
      mountMode();
    });
    const nx=document.getElementById("quizNext");if(nx)nx.onclick=()=>{quiz.q=quizNew();quiz.answered=null;mountMode();};
  }};
}

/* ============================================================
   SHELL / ĐIỀU HƯỚNG
   ============================================================ */
let currentMode="learn";
const RENDERERS={learn:renderLearn,analyze:renderAnalyze,assemble:renderAssemble,create:renderCreate,quiz:renderQuiz};

function mountMode(){
  const {html,wire}=RENDERERS[currentMode]();
  const panel=document.getElementById("panel");
  panel.innerHTML=html;
  panel.classList.remove("pop-in");void panel.offsetWidth;
  if(wire)wire();
}
function buildNav(){
  const nav=document.getElementById("modeNav");
  nav.innerHTML=MODES.map(m=>`<button class="mode-btn ${m.id===currentMode?"active":""}" data-mode="${m.id}">
    <span class="bar" style="background:${MODE_GRAD[m.id]}"></span>
    <span class="lbl">${m.label}<span class="hint">· ${m.hint}</span></span></button>`).join("");
  nav.querySelectorAll(".mode-btn").forEach(b=>b.onclick=()=>{
    currentMode=b.dataset.mode;
    // reset per-mode state để giống remount của React
    if(currentMode==="learn")learn=null;
    if(currentMode==="analyze")analyze=null;
    if(currentMode==="assemble")assemble=null;
    if(currentMode==="create")create=null;
    if(currentMode==="quiz")quiz=null;
    nav.querySelectorAll(".mode-btn").forEach(x=>x.classList.toggle("active",x.dataset.mode===currentMode));
    document.getElementById("panelBar").style.background=MODE_GRAD[currentMode];
    beep(740,60,"sine",0.04);
    mountMode();
  });
}

/* KHỞI ĐỘNG */
buildNav();
document.getElementById("panelBar").style.background=MODE_GRAD[currentMode];
mountMode();
</script>
</body>
</html>
